name: calorie_diary
description: Offline-first calorie diary with a shared catalog.
publish_to: none
version: 1.2.0+11
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  drift: 2.28.1
  sqlite3_flutter_libs: 0.5.39
  sqlite3: 2.9.4
  path_provider: 2.1.5
  path: 1.9.1
  supabase_flutter: 2.10.0
  flutter_secure_storage: 9.2.4
  uuid: 4.5.1
  file_picker: 10.3.2
  share_plus: 11.1.0
  intl: 0.20.2
  crypto: 3.0.6
  connectivity_plus: 6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
  assets:
    - assets/fonts/OFL-Rubik.txt
    - assets/fonts/OFL-Comfortaa.txt
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Montserrat.txt
    - assets/fonts/OFL-Exo2.txt
    - assets/fonts/OFL-Onest.txt
    - assets/fonts/OFL-Roboto.txt
