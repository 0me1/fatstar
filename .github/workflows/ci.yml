name: Verify Calorie Diary
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android and resolve dependencies
        run: |
          bash scripts/bootstrap_android.sh
          flutter pub get
          dart format lib test integration_test
      - name: Retain generated project and formatting on implementation branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        run: |
          git add android pubspec.lock lib test integration_test
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: retain Android scaffold, lockfile and Dart formatting'
            git push
          fi
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - name: Unit and persistence tests
        run: flutter test --coverage --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-source-and-coverage
          path: |
            android/
            pubspec.lock
            coverage/
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.53.6'
      - name: Start isolated Supabase and apply migrations
        run: supabase start
      - name: Server RLS, concurrency, history and idempotency tests
        run: |
          umask 077
          supabase status -o env > /tmp/supabase-test.env
          python3 scripts/server_tests.py /tmp/supabase-test.env
      - run: supabase stop --no-backup
        if: always()
  android:
    runs-on: ubuntu-latest
    needs: [flutter, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: bash scripts/bootstrap_android.sh && flutter pub get
      - uses: supabase/setup-cli@v1
        with:
          version: '2.53.6'
      - run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          supabase start
          umask 077
          supabase status -o env > /tmp/supabase-test.env
          python3 scripts/server_tests.py /tmp/supabase-test.env --android-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test --dart-define=SUPABASE_URL=http://10.0.2.2:54321 --dart-define=SUPABASE_ANON_KEY="$TEST_ANON_KEY"
      - run: supabase stop --no-backup
        if: always()
