name: Verify Calorie Diary
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android and resolve dependencies
        run: |
          bash scripts/bootstrap_android.sh
          flutter pub get
          dart fix --apply
          dart format lib test integration_test
      - name: Retain generated project and formatting on implementation branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        run: |
          git add android pubspec.lock lib test integration_test
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: retain Android scaffold, lockfile and Dart formatting [skip ci]'
            git push
          fi
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.txt
      - name: Unit and persistence tests
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee /tmp/flutter-tests.txt
      - name: Persist readable check results
        if: always() && github.event_name != 'pull_request'
        run: |
          cat /tmp/flutter-analyze.txt /tmp/flutter-tests.txt > /tmp/flutter-report.txt 2>/dev/null || true
          bash scripts/publish_ci_result.sh flutter /tmp/flutter-report.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: flutter-source-and-coverage
          path: |
            android/
            pubspec.lock
            coverage/
  server:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: '2.53.6'
      - name: Start isolated Supabase and apply migrations
        run: bash scripts/start_test_supabase.sh
      - name: Server RLS, concurrency, history and idempotency tests
        run: |
          umask 077
          supabase status -o env > /tmp/supabase-test.env
          set -o pipefail
          python3 scripts/server_tests.py /tmp/supabase-test.env 2>&1 | tee /tmp/server-report.txt
      - name: Persist server check results
        if: always() && github.event_name != 'pull_request'
        run: bash scripts/publish_ci_result.sh server /tmp/server-report.txt
      - run: supabase stop --no-backup
        if: always()
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [flutter, server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: bash scripts/bootstrap_android.sh && flutter pub get
      - uses: supabase/setup-cli@v1
        with:
          version: '2.53.6'
      - run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          supabase start
          umask 077
          supabase status -o env > /tmp/supabase-test.env
          python3 scripts/server_tests.py /tmp/supabase-test.env --android-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash -o pipefail -c 'flutter test integration_test --dart-define=SUPABASE_URL=http://10.0.2.2:54321 --dart-define=SUPABASE_ANON_KEY="$TEST_ANON_KEY" 2>&1 | tee /tmp/android-report.txt'
      - name: Persist Android check results
        if: always() && github.event_name != 'pull_request'
        run: bash scripts/publish_ci_result.sh android /tmp/android-report.txt
      - run: supabase stop --no-backup
        if: always()
