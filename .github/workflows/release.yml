name: Signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      DIARY_KEYSTORE_BASE64: ${{ secrets.DIARY_KEYSTORE_BASE64 }}
      DIARY_STORE_PASSWORD: ${{ secrets.DIARY_STORE_PASSWORD }}
      DIARY_KEY_ALIAS: ${{ secrets.DIARY_KEY_ALIAS }}
      DIARY_KEY_PASSWORD: ${{ secrets.DIARY_KEY_PASSWORD }}
      DIARY_KEYSTORE_PATH: /tmp/diary-release.jks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - name: Require production configuration and signing
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY DIARY_KEYSTORE_BASE64 DIARY_STORE_PASSWORD DIARY_KEY_ALIAS DIARY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing required setting: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$DIARY_KEYSTORE_BASE64" | base64 --decode > "$DIARY_KEYSTORE_PATH"
      - run: bash scripts/bootstrap_android.sh && flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Verify APK signing and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -W -n com.fatstar.calorie_diary/.MainActivity
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            python3 -c 'from pathlib import Path; s=Path("/tmp/window.xml").read_text(); assert "Calorie Diary" in s and "Войти" in s'
            adb logcat -d -s AndroidRuntime:E > build/app/outputs/flutter-apk/android-crashes.txt
            test ! -s build/app/outputs/flutter-apk/android-crashes.txt
      - uses: actions/upload-artifact@v5
        with:
          name: calorie-diary-signed-release
          path: build/app/outputs/flutter-apk/
      - name: Remove private signing material
        if: always()
        run: rm -f "$DIARY_KEYSTORE_PATH"
